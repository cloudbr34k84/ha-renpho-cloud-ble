[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["custom_components/renpho"]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/renpho"]
strict = true
explicit_package_bases = true
namespace_packages = true
# Read installed dependency annotations without checking third-party source bodies.
follow_imports = "silent"
show_error_codes = true
