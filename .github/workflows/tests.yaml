name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: |
          pip install -r requirements_test.txt
          python scripts/ha_component_requirements.py > /tmp/ha_component_requirements.txt
          pip install -r /tmp/ha_component_requirements.txt

      - name: Platinum strict typing
        run: python -m mypy

      - name: Bronze config flow coverage
        run: pytest tests/test_config_flow.py --cov=custom_components.renpho.config_flow --cov-branch --cov-report=term-missing --cov-fail-under=100

      - name: Full integration coverage
        run: |
          pytest tests/ -v --tb=short --cov=custom_components.renpho --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=100
          python scripts/check_module_coverage.py coverage.json
